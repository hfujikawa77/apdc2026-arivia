<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arivia presenter</title>
<style>
  :root { --bg:#14161c; --fg:#f2f2f2; --muted:#9aa3b2; --accent:#4fc3f7; --hl:#ffb74d; --panel:#1e222b; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans JP",sans-serif; }
  body { display:flex; flex-direction:column; }
  header { display:flex; align-items:baseline; gap:1.2em; padding:.5em 1em; background:var(--panel); border-bottom:1px solid #2c313c; flex:none; }
  header .no { font-size:1.4em; font-weight:700; color:var(--accent); }
  header .ttl { font-size:1.1em; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header .bud { color:var(--muted); }
  header .tm { font-variant-numeric:tabular-nums; font-size:1.5em; font-weight:700; cursor:pointer; user-select:none; }
  header .tm.over { color:#ff7043; }
  header .tm.paused { color:var(--muted); }
  #bar { height:6px; background:#2c313c; flex:none; }
  #bar i { display:block; height:100%; width:0; background:var(--accent); }
  main { flex:1; min-height:0; padding:.8em 1.4em; display:flex; flex-direction:column; }
  #script { flex:1; min-height:0; overflow:hidden; line-height:1.45; }
  #script p { margin:0 0 .55em; }
  #script p.sent { margin:0; }
  #script .s { display:block; }
  #script .gap { height:.5em; }
  #script i { color:var(--muted); }
  #script b { color:var(--hl); }
  #script code { color:#80e27e; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.92em; }
  footer { flex:none; display:flex; align-items:flex-start; gap:1.2em; padding:.5em 1em; background:var(--panel); border-top:1px solid #2c313c; font-size:15px; }
  footer .next { color:var(--muted); flex:none; max-width:32%; }
  footer .next b { color:var(--fg); }
  footer .pts { flex:1; color:var(--muted); line-height:1.45; max-height:30vh; overflow:auto; }
  footer .pts[hidden] { display:none; }
  footer .keys { flex:none; color:#6b7385; font-size:13px; text-align:right; }
  button { font:inherit; color:var(--fg); background:#2c313c; border:1px solid #3a4150; border-radius:6px; padding:.2em .7em; cursor:pointer; }
  button:hover { background:#38404f; }
</style>
</head>
<body>
<header>
  <span class="no" id="no"></span><span class="ttl" id="ttl"></span>
  <span class="bud" id="bud"></span>
  <span class="tm paused" id="tm" title="click / T: start·pause, R: reset">0:00</span>
</header>
<div id="bar"><i id="barfill"></i></div>
<main><div id="script"></div></main>
<footer>
  <div class="next" id="next"></div>
  <div class="pts" id="pts" hidden></div>
  <div class="keys"><button id="open">Open slides</button><br>← → : slide · T: timer · R: reset · K: key points</div>
</footer>
<script>
const SLIDES = [{"n": 1, "title": "Title", "budget": "0:30", "cum": 30, "paras": [["Hello, I'm Hideyuki Fujikawa.", "I teach drone app development at Drone Japan.", "Today I'll talk about Arivia, a water-surface drone show running ArduPilot Rover."]], "points": "名乗る(Drone Japan でドローンアプリ開発の講師)→ 何の話か 1 文。(予告「何か / 横移動 / 学び」は時間短縮のため省いた)"}, {"n": 2, "title": "What is Arivia?", "budget": "0:15", "cum": 45, "paras": [["It is made by Space One in Japan.", "It was an Honoree of the CES Innovation Awards 2026."]], "points": "**役割: 何者か(軽め)**。「Arivia は水上ドローン」は 1 ページ目で言っているので繰り返さない。会社(Space One)と CES Innovation Awards 2026 Honoree だけ。機能は次の動画で話す。自分の立場(ArduPilot 担当)は 3 ページ目で言う。画像は CES 公式ページ。使用は Space One の了承を取っておく。リンク: https://spacexone.com/ · https://www.ces.tech/ces-innovation-awards/2026/arivia-water-surface-light-and-fountain-drone/"}, {"n": 3, "title": "What can it do?", "budget": "0:50", "cum": 95, "paras": [["*(動画を再生)* (While this plays) Here is what it does.", "It has LEDs on the floater and the half-dome.", "There is a fountain on top, and a pump underneath draws the water up.", "It looks cute.", "Kids love it, and adults do too.", "Several units perform a synchronized show on the water.", "Under the hood, it's ArduPilot Rover on a Cube Orange, with an X-frame thruster layout.", "I joined the project to work on the ArduPilot side."]], "points": "**役割: 何ができるか + 自分の立場**。**動画をある程度見せる**(枠を 0:50 に延ばした。話し終わっても少し動画を流す)。**動画は 0:26 から再生**(埋め込みに `start=26`)。動画の 0:41 ごろ(再生開始の約 15 秒後)に、かわいい見た目の場面が来るので、**「It looks cute. Kids love it, and adults do too.」をそこに合わせる**(LED・噴水・ポンプの説明のあと)。「子どもにも大人気」は発表者の情報。動画は音なしなので、流しながら構造(LED / 噴水 / ポンプ)・複数台の同期・構成(Rover / Cube Orange / X フレーム)を話し、最後に **ArduPilot 側の開発担当として参加した**(Arivia 全体ではなく)と言う。仕様は公開情報の範囲で。動画の中身を推測で描写しない。"}, {"n": 4, "title": "System architecture", "budget": "0:55", "cum": 150, "paras": [["Here is how the pieces fit.", "The GCS is a Raspberry Pi 4, and it runs the show.", "Each boat has another Raspberry Pi 4 as its companion computer.", "The flight controller is a Cube Orange running Rover.", "The key idea is the split.", "The flight controller only moves the boat.", "Everything else is handled by the companion: the LEDs, the fountain and the web UI.", "One JSON timeline, with timecodes, drives position, light and water together.", "The GCS and the units talk over Wi-Fi with MAVLink."], ["The flight controller is in a waterproof case that is hard to open.", "So the web UI lets us update the custom firmware and set GUID_OPTIONS over Wi-Fi."]], "points": "左から GCS(ショー実行)→ Unit(各機の Raspberry Pi 4 = コンパニオン)→ FC(Cube Orange + Rover)。**役割分担(split)が肝**: FC は「動かす」だけ。LED・噴水・Web UI は Unit 側。ショー = タイムコード付き JSON。通信は Wi-Fi + MAVLink。\nWeb UI のエピソード: 防水ケースをなかなか開けられないので、Unit の Web UI に機能を付けた。主目的は 2 つ: ①カスタムファームの更新、②横移動を有効にする `GUID_OPTIONS`(bit 7)の設定(パラメータの参照・更新)。Wi-Fi 越しにできるので、ケースを開けずに済む。"}, {"n": 5, "title": "Why lateral move?", "budget": "0:40", "cum": 190, "paras": [["So, why do we need lateral move?", "An X-frame can move in any direction.", "But Rover normally turns first, then moves forward.", "In a show, that looks wrong.", "We want to hold the heading, and move sideways without turning.", "I asked Randy Mackay, the Rover maintainer, about this.", "He pointed me to issue 9352, open since 2018.", "So we followed his outline: a fixed heading, and a lateral speed controller."]], "points": "**役割: なぜ必要か → 既存の課題 → 採った方針**(旧 5・6 ページを 1 枚に統合)。流れ: ショーに横移動が必要(旋回 → 前進だと不自然、機首を変えずに横へ動きたい(半円形で噴水は頂上にあるので、観客の方を向く必要はない))→ **Randy Mackay さん本人に相談して、Issue #9352(2018 年から Open)を教えてもらった** → その手順に沿って **fixed heading + lateral PID** を採用。キーワード **fixed heading / lateral speed controller**。Issue の細部(`AR_AttitudeControl` に横速度コントローラ → `AR_WPNav` の出力を throttle + lateral に → 車両コードからモーターへ)と、「Manual / Acro は横移動できるが Auto / Guided で機首固定が不足」は、次の実装ページと想定質問で。画像は Issue の画面(右ペイン)。"}, {"n": 6, "title": "Implementation", "budget": "0:50", "cum": 240, "paras": [["Here is how we implemented it on Rover 4.6.3.", "We tested the changes in simulation first, and then on the real boat.", "First, the existing flow.", "Rover aims at the target, turns, and then drives.", "For lateral move, we changed four places."], ["First, the mode sets a fixed heading.", "In Auto, a CONDITION_YAW command sets it.", "In Guided, set bit 7 of GUID_OPTIONS.", "Both work on omni frames only.", "Second, the waypoint navigation holds that heading.", "Third, the position controller splits the velocity into forward and lateral.", "Fourth, a new lateral PID controls the lateral speed."]], "points": "**役割: 既存の処理と、どこを変えたか**(クラス単位の対比)。冒頭の台本で「Rover 4.6.3 に実装」と言う(5 ページでは言わない)。5 ページの方針(fixed heading + lateral PID)を受けて、ここでは中身に入る。**先に SITL(シミュレーション)で、そのあと実機**で確認した(「アプリ開発者で C++・制御は専門外、AI のサポート」は話さない。スライドの副題の「with AI support」は残っている)(7 ページの落とし穴は SITL で見つけたもの)。**既存**: 目標へ向きを回して(turn)、前進(drive)。**変更 4 か所**(スライドで印): ①モードが固定ヘディングを設定(入口: Auto は **`CONDITION_YAW`**(`MAV_CMD_CONDITION_YAW`。コード内の関数名は `do_set_yaw`。`DO_SET_YAW` という MAVLink コマンドはない)、Guided は `GUID_OPTIONS` bit 7 を立てたとき。Omni のみ)→ ②`AR_WPNav` が固定ヘディングを保持 → ③`AR_PosControl` が速度を前後/横に分解 → ④`AR_AttitudeControl` に新しい lateral PID。入口のあとの処理は Auto と Guided で共通(`Mode::navigate_to_waypoint()` の「omni かつ固定ヘディング中」の分岐)。落とし穴は次のスライドで話す。"}, {"n": 7, "title": "Pitfalls", "budget": "0:50", "cum": 290, "paras": [["We hit two pitfalls in the simulator.", "We sent five targets with a fixed heading.", "The first one worked.", "The second one never arrived.", "The boat only wiggled in place."], ["Pitfall one: the pivot turn.", "The second target was far from the fixed heading, over the pivot angle, so the waypoint navigation started a pivot.", "The pivot tried to turn the boat, but we wanted to hold the heading.", "So it could not move toward the target.", "Now the pivot is disabled while the heading is fixed."], ["Pitfall two: the init.", "The position controller's init clears the fixed heading, so the lateral speed was zero.", "Now we re-apply the heading after init."]], "points": "**役割: つまずきの共有(開発者向けの学び)**。SITL で見つけたもの(実機の水上ではない)。条件: 固定方位 290° で 5 地点を順に送る(**台本では数字(290°・122°・60°)を言わない**。スライドには出ている)。1 つ目(方位角 ≈283°、差 7°)は到達、2 つ目(方位角 ≈52°、差 122°)は**その場で左右にゆっくり動くだけで到達しない**。\n**① pivot turn(主因)** — 起きた箇所: `AR_WPNav`(pivot の判定)。原因: 方位差 122° が `WP_PIVOT_ANGLE`(既定 60°)を超えて pivot が起動し、横速度が 0 に強制される。pivot は目標へ、モードは 290° 保持で、互いに打ち消し合う。対応: 固定ヘディング中は pivot を無効化(`set_fixed_heading()` と、`update()` の毎周期)。\n**② init リセット** — 起きた箇所: `AR_WPNav` ↔ `AR_PosControl` の状態の受け渡し。原因: `AR_PosControl::init()` が固定ヘディングのフラグを false に戻すので、通常の航法(向きを目標へ旋回)になり、横速度が 0。対応: `init_pos_control_if_necessary()` で、init のあとに固定ヘディングを再適用。設計上は、状態を 2 か所が持つ構造の弱点(質疑で聞きたいところ)。3 つ目の「FF なし」は 11 枚目で話す。"}, {"n": 8, "title": "On-water test: slow, and short of the target", "budget": "0:35", "cum": 325, "paras": [["*(動画を再生)* (While this plays) This is a lateral-move test with one boat on the water.", "Watch the sideways movement.", "It's noticeably slower than forward movement.", "It also tends to stop short of the target."]], "points": "**役割: 現象を見せる(観察)**。動画は **1 台での横移動の検証**(3 台のショーではない。**0:04 から再生**、埋め込みに `start=4`)。**速度の数字は言わない**(速度は 9 で初めて言う)。「前後に比べて遅い」「手前で止まりやすい」だけを、動画を見せながら。動画の中身を推測で描写しない。3 台のショー(5/18)の終端残差 0.30 / 1.18 / 0.40 m は、ここでは言わない(想定質問へ)。"}, {"n": 9, "title": "It is slow", "budget": "0:40", "cum": 365, "paras": [["The flight logs confirm what we saw.", "We analyzed 19 Guided GoTo moves, with QZSS CLAS positioning and no base station.", "On pure lateral moves, the peak speed was 0.23 to 0.31 meters per second.", "On forward moves, it was 0.36 to 0.57.", "So sideways reached about half the peak speed of forward moves.", "But both were far below the 2.0 meters-per-second target."]], "points": "**役割: 速度を計測で裏付ける**。EKF 速度を機体座標系に変換した最大速度: 横 0.23〜0.31(5 回)、前進主体 0.36〜0.57(10 回)、目標 2.0 m/s。標本が少ないので目安として話す。「約半分」はここで初めて言う。**比較は 2 つ(横 vs 前進のピーク速度 / ピーク速度 vs 目標 2.0 m/s)を、文を分けて言う**。平均でなく**ピーク**速度。"}, {"n": 10, "title": "It also stops short", "budget": "0:40", "cum": 405, "paras": [["It also stops short.", "\"Reached\" fires when the boat is inside WP_RADIUS.", "It was set to two meters.", "So the boat can be declared \"arrived\" up to two meters early, in any direction.", "Then Rover cuts the lateral drive, clears the fixed heading, and switches to loiter.", "In the logs, sideways moves ended about 0.6 meters short.", "Forward moves ended about 0.3 meters short.", "Why is sideways worse?", "Probably because it is slower.", "We have not verified that yet."]], "points": "**役割: 手前停止を計測 → 仕組み(確定)+ 横のほうが大きい理由(仮説)**。**確定(コード)**: 「到達」は `WP_RADIUS`(= 2 m)の内側に入った時点で成立するので、**方向に関係なく**最大 2 m 手前で成立しうる。その後、横出力を切り、固定ヘディングを消し、Loiter へ。**計測**(2026-04-19、Guided GoTo 19 回、粗い見積もり: 「指定距離 − 最大移動距離」): 手前で止まった量の中央値は、横 約 0.6 m(5 回)、前進 約 0.3 m(10 回)。前後も手前で止まっており(前後には目標を越える回も 3 回)、**「前後は到達、横は未到達」ではなく程度の差**。**仮説(未検証)**: 横のほうが遅い(ピーク 約 0.3 vs 約 0.55 m/s)ので、目標位置の動き(約 5 秒で終わる)に遅れ、2 m の境界の近くで「到達」になる。以前の「0.3〜1.8 m 手前」は、再解析で再現できなかったので使わない。"}, {"n": 11, "title": "Why slow?", "budget": "0:35", "cum": 440, "paras": [["So, why is it slow?", "We don't know yet.", "We can't prove it, because the lateral PID is not logged.", "But we have one hypothesis.", "In the code, forward has a cruise-throttle feed-forward.", "Lateral does not.", "Without it, the lateral controller may not push hard enough against drag.", "This is not verified."]], "points": "**役割: 原因分析(ここだけ仮説)**。「分からない → でも仮説がある」の順。仮説は **1 つに絞る**。**事実**(コードで確認済み): 横方向には cruise throttle の FF がない(`lateral_base = 0`、前後にはある)。**仮説**(未検証): それが遅さの原因で、抗力を補い切れていない(**may** で言う)。**未検証と明言**。ログ不足(lateral PID が未ログ)が理由。次の一手(**台本では言わない**。スライドの「Next」の行を見せて、**2〜3 秒の間**を取ってから次へ進む。原因分析がいきなり終わった印象を避ける): PIDL ログ追加、WP_RADIUS を小さくして**前後・横の両方で**再試験、`ATC_LAT_FF` とゲインを 1 つずつ調整。**スライドにも「Next: lateral PID log · retest fwd / lateral with a smaller WP_RADIUS · tune」を出している**(台本の最後の文と対応)。スライドのログ行(ATT.DesYaw = 0)は台本では話さない。他の仮説は想定質問へ。"}, {"n": 12, "title": "3D show simulator", "budget": "0:05", "cum": 445, "paras": [["*(説明しないがもともと話す予定だった内容)* We rarely get time on the real boat, so we couldn't test the show content properly.", "So we built a 3D simulator: SITL with the rover-omni3mecanum frame and our lateral-move firmware.", "The same JSON show runs here, with several boats."]], "points": "**説明しない**(時間短縮のため)。スライドと動画は残してあるので、一瞬見せて次へ進む(動画は 0:40 から再生)。質問されたら: 実機を試せないので、シミュレータ(SITL + rover-omni3mecanum + 横移動ファーム)で、同じ JSON ショーを複数台で動かして確認した。**動画は 0:40 から再生**(埋め込みに `start=40`)。"}, {"n": 13, "title": "Summary & ask", "budget": "0:50", "cum": 495, "paras": [["To sum up.", "We made lateral movement with a fixed heading work on a real boat.", "But speed and positioning still need improvement."], ["The code is on the branch rover-4.6.3-lateral-move.", "I'd love to hear your thoughts.", "Would native lateral movement support be useful in ArduPilot Rover?", "And if so, how would you design it?"], ["Thank you!"]], "points": "**役割: 成果と残課題 → 問いかけ**(実装の再説明はしない)。成果 = 機首固定の横移動が実機で動いた。残課題 = 速度(前後の約半分)と到達位置。ブランチ → 「Rover に横移動のネイティブ対応は役に立つか?」「やるならどう設計するか?」。**一文ごとに間を取る**。upstream PR の予定はないので、提案でなく共有と相談の形。連絡先: hfujikawa77@gmail.com。 **「Thank you!」のあとに少し間を取る**(発表の終わり → 質疑へ切り替わる合図)。次の 14 ページの「I'm happy to take your questions.」はその後。"}, {"n": 14, "title": "Thank you", "budget": "0:10", "cum": 505, "paras": [["The code and my links are behind this QR code.", "I'm happy to take your questions."]], "points": "**役割: 終わりのカード(質疑の背景)**。13 ページの「Thank you!」で発表は終わり。ここは質疑のあいだ映しておく。動画は **頭(0:00)から、音なしで自動再生・ループ**。3 ページでは 0:26 から見せたので、「仕組みを知ったうえで、もう一度」見てもらえる。QR は **リンクページ**(https://hfujikawa77.github.io/apdc2026-arivia/links/)へ: コード(`rover-4.6.3-lateral-move`)・Issue #9352・スライド・GitHub・X・YouTube・メール。QR の下に URL も文字で出している(読み取れない人用)。"}];
const TOTAL = SLIDES.length ? SLIDES[SLIDES.length - 1].cum : 0;
const esc = t => t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const md = t => esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*\((.+?)\)\*/g,'<i>($1)</i>').replace(/`([^`]+)`/g,'<code>$1</code>');
const $ = id => document.getElementById(id);
let cur = 0, running = false, elapsed = 0, last = 0, showPts = false;
let ch = null; try { ch = new BroadcastChannel('arivia-en2'); } catch (e) {}

function fit() {
  const el = $('script'); let lo = 14, hi = 90;
  while (hi - lo > 1) { const mid = (lo + hi) >> 1; el.style.fontSize = mid + 'px';
    if (el.scrollHeight <= el.clientHeight) lo = mid; else hi = mid; }
  el.style.fontSize = lo + 'px';
}
function render() {
  const s = SLIDES[cur];
  $('no').textContent = s.n + ' / ' + SLIDES.length;
  $('ttl').textContent = s.title;
  $('bud').textContent = 'budget ' + s.budget + ' · cumulative ' + fmt(s.cum) + ' / ' + fmt(TOTAL);
  $('script').innerHTML = s.paras.map(p => '<p class="sent">' + p.map(x => '<span class="s">' + md(x) + '</span>').join('') + '</p><div class="gap"></div>').join('');
  const nx = SLIDES[cur + 1];
  $('next').innerHTML = nx ? 'Next: <b>' + (cur + 2) + '. ' + esc(nx.title) + '</b>' : '<b>End</b>';
  $('pts').innerHTML = md(s.points); $('pts').hidden = !showPts;
  fit(); tick();
}
function fmt(sec) { sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }
function tick() {
  const now = performance.now(); if (running) { elapsed += (now - last) / 1000; } last = now;
  const tm = $('tm'); tm.textContent = fmt(elapsed);
  tm.classList.toggle('paused', !running); tm.classList.toggle('over', elapsed > SLIDES[cur].cum);
  $('barfill').style.width = Math.min(100, (elapsed / 600) * 100) + '%';
}
function go(i, notify) {
  i = Math.max(0, Math.min(SLIDES.length - 1, i)); if (i === cur) return;
  cur = i; render(); if (notify && ch) ch.postMessage({ t: 'goto', h: cur });
}
function toggle() { running = !running; last = performance.now(); tick(); }
document.addEventListener('keydown', e => {
  if (['ArrowRight','PageDown',' ','Enter'].includes(e.key)) { go(cur + 1, true); e.preventDefault(); }
  else if (['ArrowLeft','PageUp','Backspace'].includes(e.key)) { go(cur - 1, true); e.preventDefault(); }
  else if (e.key === 'Home') go(0, true); else if (e.key === 'End') go(SLIDES.length - 1, true);
  else if (e.key === 't' || e.key === 'T') toggle();
  else if (e.key === 'r' || e.key === 'R') { elapsed = 0; running = false; tick(); }
  else if (e.key === 'k' || e.key === 'K') { showPts = !showPts; $('pts').hidden = !showPts; fit(); }
});
$('tm').onclick = toggle;
$('open').onclick = () => window.open('./index.html#/' + cur, 'arivia-slides');
if (ch) ch.onmessage = m => { if (m.data && m.data.t === 'slide') go(m.data.h, false); };
window.addEventListener('resize', fit);
// follow the deck across devices via serve.py (works on a phone over USB; fails quietly on file://)
setInterval(async () => {
  try { const s = await (await fetch('../api/state',{ cache: 'no-store' })).json(); if (s && s.h !== undefined) go(s.h, false); } catch (e) {}
}, 400);
setInterval(tick, 250);
render();
</script>
</body>
