<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arivia presenter</title>
<style>
  :root { --bg:#14161c; --fg:#f2f2f2; --muted:#9aa3b2; --accent:#4fc3f7; --hl:#ffb74d; --panel:#1e222b; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans JP",sans-serif; }
  body { display:flex; flex-direction:column; }
  header { display:flex; align-items:baseline; gap:1.2em; padding:.5em 1em; background:var(--panel); border-bottom:1px solid #2c313c; flex:none; }
  header .no { font-size:1.4em; font-weight:700; color:var(--accent); }
  header .ttl { font-size:1.1em; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header .bud { color:var(--muted); }
  header .tm { font-variant-numeric:tabular-nums; font-size:1.5em; font-weight:700; cursor:pointer; user-select:none; }
  header .tm.over { color:#ff7043; }
  header .tm.paused { color:var(--muted); }
  #bar { height:6px; background:#2c313c; flex:none; }
  #bar i { display:block; height:100%; width:0; background:var(--accent); }
  main { flex:1; min-height:0; padding:.8em 1.4em; display:flex; flex-direction:column; }
  #script { flex:1; min-height:0; overflow:hidden; line-height:1.45; }
  #script p { margin:0 0 .55em; }
  #script p.sent { margin:0; }
  #script .s { display:block; }
  #script .gap { height:.5em; }
  #script i { color:var(--muted); }
  #script b { color:var(--hl); }
  #script code { color:#80e27e; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.92em; }
  footer { flex:none; display:flex; align-items:flex-start; gap:1.2em; padding:.5em 1em; background:var(--panel); border-top:1px solid #2c313c; font-size:15px; }
  footer .next { color:var(--muted); flex:none; max-width:32%; }
  footer .next b { color:var(--fg); }
  footer .pts { flex:1; color:var(--muted); line-height:1.45; max-height:30vh; overflow:auto; }
  footer .pts[hidden] { display:none; }
  footer .keys { flex:none; color:#6b7385; font-size:13px; text-align:right; }
  button { font:inherit; color:var(--fg); background:#2c313c; border:1px solid #3a4150; border-radius:6px; padding:.2em .7em; cursor:pointer; }
  button:hover { background:#38404f; }
</style>
</head>
<body>
<header>
  <span class="no" id="no"></span><span class="ttl" id="ttl"></span>
  <span class="bud" id="bud"></span>
  <span class="tm paused" id="tm" title="click / T: start·pause, R: reset">0:00</span>
</header>
<div id="bar"><i id="barfill"></i></div>
<main><div id="script"></div></main>
<footer>
  <div class="next" id="next"></div>
  <div class="pts" id="pts" hidden></div>
  <div class="keys"><button id="open">Open slides</button><br>← → : slide · T: timer · R: reset · K: key points</div>
</footer>
<script>
const SLIDES = [{"n": 1, "title": "Title", "budget": "0:30", "cum": 30, "paras": [["Hello, I'm Hideyuki Fujikawa.", "I teach drone app development at Drone Japan.", "Today I'll talk about Arivia, a water-surface drone show running ArduPilot Rover.", "I'll show what it is, how we made it move sideways, and what we learned."]], "points": "名乗る(Drone Japan でドローンアプリ開発の講師)→ 何の話か 1 文 → 予告(何か / 横移動 / 学び)。"}, {"n": 2, "title": "What is Arivia?", "budget": "0:20", "cum": 50, "paras": [["Arivia is an autonomous water-surface drone.", "It is made by Space One in Japan.", "It was an Honoree of the CES Innovation Awards 2026.", "I joined the project to work on the ArduPilot side."]], "points": "**役割: 何者か**(機能は次の動画で話す)。会社(Space One)・CES Innovation Awards 2026 Honoree・自分は **ArduPilot 側の開発担当として参加した**(Arivia 全体ではなく)。画像は CES 公式ページ。使用は Space One の了承を取っておく。リンク: https://spacexone.com/ · https://www.ces.tech/ces-innovation-awards/2026/arivia-water-surface-light-and-fountain-drone/"}, {"n": 3, "title": "What can it do?", "budget": "0:35", "cum": 85, "paras": [["*(動画を再生)* (While this plays) Here is what it does.", "It has LEDs on the floater and the half-dome.", "There is a fountain on top, and a pump underneath draws the water up.", "Several units perform a synchronized show on the water.", "Under the hood, it's ArduPilot Rover on a Cube Orange, with an X-frame thruster layout."]], "points": "**役割: 何ができるか**。動画は音なしなので、流しながら構造(LED / 噴水 / ポンプ)・複数台の同期・構成(Rover / Cube Orange / X フレーム)を話す。仕様は公開情報の範囲で。動画の中身を推測で描写しない。"}, {"n": 4, "title": "System architecture", "budget": "1:05", "cum": 150, "paras": [["Here is how the pieces fit.", "The GCS is a Raspberry Pi 4, and it runs the show.", "Each boat has another Raspberry Pi 4 as its companion computer.", "The flight controller is a Cube Orange running Rover.", "The key idea is the split.", "The flight controller only moves the boat.", "Everything else is handled by the companion: the LEDs, the fountain and the web UI.", "One JSON timeline, with timecodes, drives position, light and water together.", "The GCS and the units talk over Wi-Fi with MAVLink."], ["One more thing about the web UI.", "The flight controller is inside a waterproof case, and the case is hard to open.", "So we gave the web UI two features.", "One: updating our custom firmware.", "Two: setting GUID_OPTIONS, which turns lateral move on.", "Now we do both over Wi-Fi, without opening the case."]], "points": "左から GCS(ショー実行)→ Unit(各機の Raspberry Pi 4 = コンパニオン)→ FC(Cube Orange + Rover)。**役割分担(split)が肝**: FC は「動かす」だけ。LED・噴水・Web UI は Unit 側。ショー = タイムコード付き JSON。通信は Wi-Fi + MAVLink。\nWeb UI のエピソード: 防水ケースをなかなか開けられないので、Unit の Web UI に機能を付けた。主目的は 2 つ: ①カスタムファームの更新、②横移動を有効にする `GUID_OPTIONS`(bit 7)の設定(パラメータの参照・更新)。Wi-Fi 越しにできるので、ケースを開けずに済む。"}, {"n": 5, "title": "Why lateral move?", "budget": "0:30", "cum": 180, "paras": [["So, why do we need lateral move?", "An X-frame can move in any direction.", "But Rover normally turns first, then moves forward.", "In a show, that looks wrong.", "We want to hold the heading, so the LEDs and the fountain keep facing the audience, while the boat moves sideways.", "That means a fixed heading, and a lateral velocity."]], "points": "**役割: なぜ必要か**。問題(旋回 → 前進)→ 欲しい動き(機首固定で横移動)→ キーワード **fixed heading / lateral velocity**。Issue と既存機能の話は 6 枚目に回した(重複させない)。"}, {"n": 6, "title": "Open since 2018: issue #9352", "budget": "0:20", "cum": 200, "paras": [["I asked Randy Mackay, the Rover maintainer, about this.", "He pointed me to issue 9352, which has been open since 2018.", "It's the same idea: a fixed heading with lateral movement.", "We built our implementation on Rover 4.6.3."]], "points": "**5 ページと同じ内容**(機首固定で横移動)だと一言で伝える。**Randy Mackay さん本人に相談して、この Issue を教えてもらった**(2018 年から Open)。彼の手順に沿って Rover 4.6.3 で実装。細かい手順(横速度コントローラ → AR_WPNav → モーター)や「Manual / Acro は横移動できるが Auto / Guided が不足」は、聞かれたら話す。"}, {"n": 7, "title": "Implementation", "budget": "0:50", "cum": 250, "paras": [["Here is how we implemented it.", "I'm an app developer, not a C++ or control expert.", "So I had support from AI, and we checked the changes on the real boat.", "The flow has four steps.", "First, we receive a position target in Guided or Auto mode.", "Second, the waypoint navigation holds the fixed heading.", "Third, the position controller splits the velocity into forward and lateral.", "Finally, a new lateral PID controls the lateral speed."], ["How to use it: in Auto, a CONDITION_YAW command sets the fixed heading.", "In Guided, set bit 7 of GUID_OPTIONS.", "Both work on omni frames only."]], "points": "6 ページの「Rover 4.6.3 で実装」を受けて、ここでは「実装の中身」に入る(バージョンは繰り返さない)。アプリ開発者で C++・制御は専門外なので、**AI のサポートを受けて**開発し、実機で確認した。流れ 4 段階(位置目標 → WP nav が固定ヘディング保持 → 位置制御が前後/横に分解 → 新しい lateral PID)→ **使い方**(Auto は **`CONDITION_YAW`**(`MAV_CMD_CONDITION_YAW`。コード内の関数名は `do_set_yaw`。`DO_SET_YAW` という MAVLink コマンドはない)、Guided は `GUID_OPTIONS` bit 7、Omni のみ)。落とし穴は次のスライドで話す。"}, {"n": 8, "title": "Pitfalls", "budget": "0:25", "cum": 275, "paras": [["We hit two pitfalls along the way.", "First, the position controller's init reset the fixed heading, so the lateral output stalled.", "Second, the pivot turn fought the fixed heading.", "Rover tried to turn the boat, but we wanted to hold the heading."]], "points": "**役割: つまずきの共有(開発者向けの学び)**。①`AR_PosControl::init` が固定ヘディングをリセット → 横の出力が止まった。②pivot turn(その場旋回)が固定ヘディングと競合(Rover は向きを変えようとし、こちらは保持したい)。「fought」が出にくければ \"worked against\" でもよい。3 つ目の「FF なし」は次の次(12 枚目)で話す。"}, {"n": 9, "title": "On-water test: slow, and short of the target", "budget": "0:35", "cum": 310, "paras": [["*(動画を再生)* (While this plays) This is a lateral-move test with one boat on the water.", "Watch the sideways movement.", "It's noticeably slower than forward movement.", "It also tends to stop short of the target."]], "points": "**役割: 現象を見せる(観察)**。動画は **1 台での横移動の検証**(3 台のショーではない)。**速度の数字は言わない**(速度は 10 で初めて言う)。「前後に比べて遅い」「手前で止まりやすい」だけを、動画を見せながら。動画の中身を推測で描写しない。3 台のショー(5/18)の終端残差 0.30 / 1.18 / 0.40 m は、ここでは言わない(想定質問へ)。"}, {"n": 10, "title": "It is slow", "budget": "0:40", "cum": 350, "paras": [["The flight logs confirm what we saw.", "We analyzed 19 Guided GoTo moves, with QZSS CLAS positioning and no base station.", "On pure lateral moves, the peak speed was 0.23 to 0.31 meters per second.", "On forward moves, it was 0.36 to 0.57.", "So sideways reached about half the peak speed of forward moves.", "But both were far below the 2.0 meters-per-second target."]], "points": "**役割: 速度を計測で裏付ける**。EKF 速度を機体座標系に変換した最大速度: 横 0.23〜0.31(5 回)、前進主体 0.36〜0.57(10 回)、目標 2.0 m/s。標本が少ないので目安として話す。「約半分」はここで初めて言う。**比較は 2 つ(横 vs 前進のピーク速度 / ピーク速度 vs 目標 2.0 m/s)を、文を分けて言う**。平均でなく**ピーク**速度。"}, {"n": 11, "title": "It also stops short", "budget": "0:30", "cum": 380, "paras": [["It also stops short.", "The logs show that \"reached\" fires 0.3 to 1.8 meters before the target.", "Why?", "The reason is WP_RADIUS.", "It was set to two meters.", "Once the boat is inside that circle, Rover says \"reached\".", "Then it cuts the lateral drive, clears the fixed heading, and switches to loiter.", "This one we confirmed in the code and the logs."]], "points": "**役割: 手前停止を計測 → 原因(確定)**。「到達」が目標の 0.3〜1.8 m 手前で成立(WP_RADIUS = 2 m)→ 横出力を切り、固定ヘディングを消し、Loiter へ。コードとログで確認済み(仮説ではない)。"}, {"n": 12, "title": "Why slow?", "budget": "0:35", "cum": 415, "paras": [["So, why is it slow?", "We don't know yet.", "We can't prove it, because the lateral PID is not logged.", "But we have one hypothesis.", "In the code, forward has a cruise-throttle feed-forward.", "Lateral does not.", "Without it, the lateral controller may not push hard enough against drag.", "This is not verified.", "Next, we'll add lateral PID logging, retest with a smaller WP_RADIUS, and tune the controller."]], "points": "**役割: 原因分析(ここだけ仮説)**。「分からない → でも仮説がある」の順。仮説は **1 つに絞る**。**事実**(コードで確認済み): 横方向には cruise throttle の FF がない(`lateral_base = 0`、前後にはある)。**仮説**(未検証): それが遅さの原因で、抗力を補い切れていない(**may** で言う)。**未検証と明言**。ログ不足(lateral PID が未ログ)が理由。次の一手: PIDL ログ追加、WP_RADIUS を小さくして再試験、`ATC_LAT_FF` とゲインを 1 つずつ調整。**スライドにも「Next: lateral PID log · retest with a smaller WP_RADIUS · tune」を出している**(台本の最後の文と対応)。スライドのログ行(ATT.DesYaw = 0)は台本では話さない。他の仮説は想定質問へ。"}, {"n": 13, "title": "3D show simulator", "budget": "0:35", "cum": 450, "paras": [["*(動画を再生)* (While this plays) We rarely get time on the real boat, so we couldn't test the show content properly.", "So we built a 3D simulator: SITL with the rover-omni3mecanum frame and our lateral-move firmware.", "The same JSON show runs here, with several boats."]], "points": "実機を試せない → シミュレータ(SITL + 横移動ファーム)→ 同じ JSON ショーが複数台で動く。"}, {"n": 14, "title": "Summary & ask", "budget": "0:50", "cum": 500, "paras": [["To sum up.", "We made lateral movement with a fixed heading work on a real boat.", "But speed and positioning still need improvement."], ["The code is on the branch rover-4.6.3-lateral-move.", "I'd love to hear your thoughts.", "Would native lateral movement support be useful in ArduPilot Rover?", "And if so, how would you design it?"], ["Thank you!"]], "points": "**役割: 成果と残課題 → 問いかけ**(実装の再説明はしない)。成果 = 機首固定の横移動が実機で動いた。残課題 = 速度(前後の約半分)と到達位置。ブランチ → 「Rover に横移動のネイティブ対応は役に立つか?」「やるならどう設計するか?」。**一文ごとに間を取る**。upstream PR の予定はないので、提案でなく共有と相談の形。連絡先: hfujikawa77@gmail.com。"}];
const TOTAL = SLIDES.length ? SLIDES[SLIDES.length - 1].cum : 0;
const esc = t => t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const md = t => esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*\((.+?)\)\*/g,'<i>($1)</i>').replace(/`([^`]+)`/g,'<code>$1</code>');
const $ = id => document.getElementById(id);
let cur = 0, running = false, elapsed = 0, last = 0, showPts = false;
let ch = null; try { ch = new BroadcastChannel('arivia-en2'); } catch (e) {}

function fit() {
  const el = $('script'); let lo = 14, hi = 90;
  while (hi - lo > 1) { const mid = (lo + hi) >> 1; el.style.fontSize = mid + 'px';
    if (el.scrollHeight <= el.clientHeight) lo = mid; else hi = mid; }
  el.style.fontSize = lo + 'px';
}
function render() {
  const s = SLIDES[cur];
  $('no').textContent = s.n + ' / ' + SLIDES.length;
  $('ttl').textContent = s.title;
  $('bud').textContent = 'budget ' + s.budget + ' · cumulative ' + fmt(s.cum) + ' / ' + fmt(TOTAL);
  $('script').innerHTML = s.paras.map(p => '<p class="sent">' + p.map(x => '<span class="s">' + md(x) + '</span>').join('') + '</p><div class="gap"></div>').join('');
  const nx = SLIDES[cur + 1];
  $('next').innerHTML = nx ? 'Next: <b>' + (cur + 2) + '. ' + esc(nx.title) + '</b>' : '<b>End</b>';
  $('pts').innerHTML = md(s.points); $('pts').hidden = !showPts;
  fit(); tick();
}
function fmt(sec) { sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }
function tick() {
  const now = performance.now(); if (running) { elapsed += (now - last) / 1000; } last = now;
  const tm = $('tm'); tm.textContent = fmt(elapsed);
  tm.classList.toggle('paused', !running); tm.classList.toggle('over', elapsed > SLIDES[cur].cum);
  $('barfill').style.width = Math.min(100, (elapsed / 600) * 100) + '%';
}
function go(i, notify) {
  i = Math.max(0, Math.min(SLIDES.length - 1, i)); if (i === cur) return;
  cur = i; render(); if (notify && ch) ch.postMessage({ t: 'goto', h: cur });
}
function toggle() { running = !running; last = performance.now(); tick(); }
document.addEventListener('keydown', e => {
  if (['ArrowRight','PageDown',' ','Enter'].includes(e.key)) { go(cur + 1, true); e.preventDefault(); }
  else if (['ArrowLeft','PageUp','Backspace'].includes(e.key)) { go(cur - 1, true); e.preventDefault(); }
  else if (e.key === 'Home') go(0, true); else if (e.key === 'End') go(SLIDES.length - 1, true);
  else if (e.key === 't' || e.key === 'T') toggle();
  else if (e.key === 'r' || e.key === 'R') { elapsed = 0; running = false; tick(); }
  else if (e.key === 'k' || e.key === 'K') { showPts = !showPts; $('pts').hidden = !showPts; fit(); }
});
$('tm').onclick = toggle;
$('open').onclick = () => window.open('./index.html#/' + cur, 'arivia-slides');
if (ch) ch.onmessage = m => { if (m.data && m.data.t === 'slide') go(m.data.h, false); };
window.addEventListener('resize', fit);
setInterval(tick, 250);
render();
</script>
</body>
</html>
